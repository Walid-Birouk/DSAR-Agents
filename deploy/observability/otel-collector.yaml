# The collector is the third line of defence against personal data in telemetry (PLAN.md 9). The desk sends no
# contents by design, and its scrubber checks every attribute; here the redaction processor masks any value
# that still looks like an email address or a phone number before it is stored.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  redaction:
    allow_all_keys: true
    blocked_values:
      # single quotes: YAML must not read the backslashes as escapes (validated with `otelcol validate`)
      - '[\w.+-]+@[\w-]+(\.[\w-]+)+'
      - '(\+\d{2}\s?|\b0)\d([\s.-]?\d{2}){4}\b'
    summary: info
  batch: {}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [redaction, batch]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
