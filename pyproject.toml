[project]
name = "article15"
version = "0.1.0"
description = "A multi-agent desk that answers GDPR right-of-access requests, with evals, observability and policy as code."
readme = "README.md"
license = "MIT"
authors = [{ name = "Walid Birouk" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic==2.14.4",
    "pyyaml==6.0.3",
    "holidays==0.109",
    "mcp==2.3.0",
    "anyio==4.16.0",
    "openai==3.57.0",
]

[project.scripts]
a15 = "article15.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.17",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/article15"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["article15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
