name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Policy lint (rules vs code guards)
        run: uv run a15 policy-lint
      - name: Replay smoke (recorded live runs, free; fails if any replay differs)
        run: |
          if [ -d evals/cassettes/smoke ]; then
            uv run a15 generate
            uv run a15 eval run --suite smoke --agent replay --replay evals/cassettes/smoke --fail-on replay --out runs/ci-replay-smoke
          else
            echo "no smoke recordings yet (evals/cassettes/smoke); skipped"
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
