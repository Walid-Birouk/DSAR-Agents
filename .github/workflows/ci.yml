name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests, policy, replays
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Generate the fictional company (seed 15)
        run: uv run a15 generate
      - name: Tests (unit, the oracle on every case, the broken versions, every recorded live run replayed)
        run: uv run pytest -q
      - name: Policy lint (rules vs code guards)
        run: uv run a15 policy-lint
      - name: Replay smoke, one agent and seven (recorded live runs, free; fails if any replay differs)
        run: |
          uv run a15 eval run --suite smoke --agent replay --replay evals/cassettes/smoke --fail-on replay --out runs/ci-replay-smoke
          uv run a15 eval run --suite smoke --arm team --agent replay --replay evals/cassettes/smoke-team --fail-on replay --out runs/ci-replay-smoke-team
      - name: "Hard gates on the oracle (the harness itself: green on all 160 cases)"
        run: uv run a15 eval run --suite full --jobs 4 --out runs/ci-oracle-full
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: runs/ci-*/report.md
          if-no-files-found: ignore

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: web app in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - name: Generate the fictional company
        run: uv run a15 generate
      - name: Typecheck, build and test the web app in a browser (flows, axe, keyboard)
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (not pushed; releases push it, see release.yml)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: a15:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The container starts, runs as non-root, and answers its health check
        run: |
          docker run -d --name a15 --read-only --tmpfs /tmp -v a15-runs:/app/runs -p 8000:8000 a15:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/health
          test "$(docker exec a15 id -u)" = "10015"
          curl -fsS http://127.0.0.1:8000/api/harness > /dev/null
      - name: Logs
        if: failure()
        run: docker logs a15

  deploy-config:
    name: deployment and observability configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose files
        run: |
          cp deploy/production.env.example deploy/production.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/production.env config --quiet
          GRAFANA_ADMIN_PASSWORD=ci docker compose -f deploy/observability/docker-compose.yml config --quiet
      - name: The OpenTelemetry collector accepts its config (the redaction processor's patterns included)
        run: |
          docker run --rm -v "$PWD/deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.165.0 validate --config=/etc/otelcol/config.yaml
      - name: Prometheus accepts its config and its alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.16.0 check config /etc/prometheus/prometheus.yml
      - name: Caddy accepts its config
        run: |
          docker run --rm -e A15_DOMAIN=desk.example.org -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
